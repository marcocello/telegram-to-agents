<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Codex remote architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --link: #2e5aa8;
      --sans: "Geist", system-ui, sans-serif;
      --serif: "Instrument Serif", serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    main { width: min(1200px, 100%); }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.08;
    }

    .subtitle {
      max-width: 720px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 900px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · Codex remote setup</p>
    <h1>One Codex environment, three ways in</h1>
    <p class="subtitle">Codex runs on the VM. The desktop and mobile apps reach it through Remote Control, while Telegram uses a deliberately thin gateway into the same runtime.</p>

    <div class="diagram">
      <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-remote-title codex-remote-desc">
        <title id="codex-remote-title">My Codex remote architecture</title>
        <desc id="codex-remote-desc">The ChatGPT and Codex app on a Mac and the ChatGPT mobile and Telegram apps on a phone connect to a Codex runtime on a VM, with Telegram routed through the telegram-to-agents gateway and the VM using its dot-codex home, Zotero, email, and other tools.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1000" height="600" fill="#f5f5f5"/>

        <!-- VM trust boundary -->
        <rect x="400" y="40" width="560" height="464" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4 4"/>
        <rect x="416" y="44" width="128" height="16" rx="4" fill="#f5f5f5"/>
        <text x="480" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LINUX VM</text>

        <!-- Connections: drawn before nodes -->
        <line x1="280" y1="160" x2="608" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 200 312 V 272 Q 200 264 208 264 H 560 Q 568 264 568 256 V 204 Q 568 196 576 196 H 608" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="280" y1="376" x2="424" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <path d="M 512 336 V 288 Q 512 280 520 280 H 648 Q 656 280 656 272 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 736 224 V 288 Q 736 296 728 296 H 704 Q 696 296 696 304 V 336" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 816 224 V 272 Q 816 280 824 280 H 856 Q 864 280 864 288 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels: masks retain a visible gap from connectors -->
        <rect x="384" y="136" width="112" height="12" rx="4" fill="#f5f5f5"/>
        <text x="440" y="144" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REMOTE CONTROL</text>

        <rect x="320" y="240" width="112" height="12" rx="4" fill="#f5f5f5"/>
        <text x="376" y="248" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REMOTE CONTROL</text>

        <rect x="304" y="352" width="72" height="12" rx="4" fill="#f5f5f5"/>
        <text x="340" y="360" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TELEGRAM</text>

        <rect x="544" y="256" width="80" height="12" rx="4" fill="#f5f5f5"/>
        <text x="584" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP SERVER</text>

        <rect x="744" y="248" width="48" height="16" rx="4" fill="#f5f5f5"/>
        <text x="768" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

        <rect x="824" y="256" width="48" height="12" rx="4" fill="#f5f5f5"/>
        <text x="848" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOLS</text>

        <!-- Client nodes -->
        <rect x="40" y="112" width="240" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="40" y="112" width="240" height="96" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="52" y="124" width="64" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="84" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DESKTOP</text>
        <text x="160" y="164" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ChatGPT/Codex app</text>
        <text x="160" y="184" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">(Mac)</text>

        <rect x="40" y="312" width="240" height="128" rx="8" fill="#f5f5f5"/>
        <rect x="40" y="312" width="240" height="128" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="52" y="324" width="56" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="80" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOBILE</text>
        <text x="160" y="372" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ChatGPT mobile app</text>
        <text x="160" y="392" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Telegram</text>
        <text x="160" y="412" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">(Phone)</text>

        <!-- VM nodes -->
        <rect x="608" y="112" width="256" height="112" rx="8" fill="#f5f5f5"/>
        <rect x="608" y="112" width="256" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="620" y="124" width="64" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="652" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
        <text x="736" y="164" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codex CLI + App Server</text>
        <text x="736" y="184" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">codex remote-control</text>
        <text x="736" y="204" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one native environment</text>

        <rect x="424" y="336" width="176" height="112" rx="8" fill="#f5f5f5"/>
        <rect x="424" y="336" width="176" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="348" width="88" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="480" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THIN LAYER</text>
        <text x="512" y="392" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telegram to Agents</text>
        <text x="512" y="412" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">auth · files · routing</text>
        <text x="512" y="432" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">no agent logic</text>

        <rect x="624" y="336" width="144" height="112" rx="8" fill="#f5f5f5"/>
        <rect x="624" y="336" width="144" height="112" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="636" y="348" width="48" height="16" rx="4" fill="transparent" stroke="rgba(235,108,54,0.48)" stroke-width="0.8"/>
        <text x="660" y="360" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="696" y="392" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">.codex</text>
        <text x="696" y="412" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">skills · settings</text>
        <text x="696" y="432" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">instructions</text>

        <rect x="792" y="336" width="144" height="112" rx="8" fill="#f5f5f5"/>
        <rect x="792" y="336" width="144" height="112" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="804" y="348" width="56" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="832" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACCESS</text>
        <text x="864" y="392" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resources</text>
        <text x="864" y="412" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Zotero · email</text>
        <text x="864" y="432" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">other tools</text>

        <!-- Bottom legend -->
        <line x1="40" y1="528" x2="960" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="136" y="540" width="16" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
        <text x="164" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLIENT</text>

        <rect x="260" y="540" width="16" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="288" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RUNTIME / GATEWAY</text>

        <rect x="468" y="540" width="16" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="496" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CODEX HOME</text>

        <line x1="636" y1="548" x2="688" y2="548" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="704" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">REMOTE / APP LINK</text>
      </svg>
    </div>
  </main>
</body>
</html>
